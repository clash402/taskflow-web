name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: quality-and-tests
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (if configured)
        run: npm run format --if-present

      - name: Lint
        run: npm run lint

      - name: Typecheck (if configured)
        run: npm run typecheck --if-present

      - name: Run unit/integration tests (if configured)
        run: npm test --if-present

      - name: Build
        run: npm run build

  security-dependencies:
    name: security-dependencies
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (HIGH/CRITICAL)
        run: npm audit --audit-level=high
